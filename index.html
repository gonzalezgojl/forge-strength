<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FORGE — Strength Training</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090d0b;color:#f3f6f1;font:15px system-ui}
.load{text-align:center;padding:24px}.mark{font-size:42px;font-weight:950;letter-spacing:.14em;color:#c9ff47}.muted{color:#9aa79e;font-size:13px}
</style>
</head>
<body>
<div class="load"><div class="mark">FORGE</div><p>Preparing your training system…</p><p class="muted">Loading the exercise library</p></div>
<script>
(async()=>{
 try{
  const names=['app.v3.part1.txt','app.v3.part2.txt','app.v3.part3.txt','app.v3.part4.txt','app.v3.part5.txt','app.v3.part6.txt','app.v3.part7.txt','app.v3.part8.txt'];
  const chunks=await Promise.all(names.map(async name=>{
   const response=await fetch(name,{cache:'no-cache'});
   if(!response.ok)throw new Error('Unable to load '+name);
   return (await response.text()).trim();
  }));
  const binary=atob(chunks.join(''));
  const bytes=Uint8Array.from(binary,char=>char.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(error){
  document.body.innerHTML='<div class="load"><div class="mark">FORGE</div><p>Unable to load the app.</p><p class="muted">'+String(error.message||error)+'</p></div>';
 }
})();
</script>
</body>
</html>
