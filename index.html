<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e0d"><title>FORGE — Strength Training</title><style>body{margin:0;background:#0b0e0d;color:#f4f7f2;font:16px system-ui;display:grid;min-height:100vh;place-items:center}.load{text-align:center;padding:24px}.mark{font-weight:900;font-size:42px;color:#c9ff47;letter-spacing:.12em}.muted{color:#929d96;font-size:13px}</style></head><body><div class="load"><div class="mark">FORGE</div><p>Preparing your training system…</p><p class="muted">Loading exercise library</p></div><script>(async()=>{try{const r=await fetch('app.part1.txt');if(!r.ok)throw Error('Could not load the app package');const b64=(await r.text()).replace(/\s/g,'');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><div class="mark">FORGE</div><p>Unable to load the app.</p><p class="muted">'+e.message+'</p></div>'}})();</script></body></html>
