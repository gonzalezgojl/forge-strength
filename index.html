const progressKey="forge_fourday_daily_v3";
const historyKey="forge_fourday_history_v3";
let active=0,library=[],libraryState="loading";
let completions=readStore(progressKey,{});
let history=readStore(historyKey,[]);
function readStore(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function save(){localStorage.setItem(progressKey,JSON.stringify(completions));localStorage.setItem(historyKey,JSON.stringify(history))}
function localDate(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function mondayOfWeek(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return localDate(d)}
function isDone(id,date=localDate()){return !!completions[date+"|"+id]}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim()}
function getArtwork(ex){
 if(!library.length)return null;
 const aliases=(ex.aliases||[]).map(norm);
 let best=null,bestScore=0;
 for(const item of library){
  const id=norm(item.id),en=norm(item.name_en),es=norm(item.name_es);
  let score=0;
  for(const a of aliases){
   if(id===a)score=Math.max(score,120);
   if(id.replace(/ /g,"-")===a.replace(/ /g,"-"))score=Math.max(score,118);
   if(en===a||es===a)score=Math.max(score,110);
   if((en+" "+es).includes(a)||a.includes(en)&&en.length>5)score=Math.max(score,85+a.length/100);
   if(id.includes(a)||a.includes(id)&&id.length>6)score=Math.max(score,75+a.length/100);
  }
  if(score>bestScore){best=item;bestScore=score}
 }
 if(!best||bestScore<75)return null;
 return best.images&&best.images.flat?best.images.flat:null;
}
function imgURL(path){if(!path)return "";return /^https?:/i.test(path)?path:"https://exercise-dataset.com/"+String(path).replace(/^\/+/,"")}
function imageHTML(ex){
 const art=getArtwork(ex);
 if(!art)return '<div class="img-pending">'+(libraryState==="loading"?"…":"")+'</div>';
 const start=art.start||art.main,peak=art.peak||art.main;
 if(!start&&!peak)return '<div class="img-pending"></div>';
 if(start&&peak&&start!==peak)return '<div class="sequence"><img class="pose" loading="lazy" alt="" src="'+imgURL(start)+'"><span class="pose-arrow">→</span><img class="pose" loading="lazy" alt="" src="'+imgURL(peak)+'"></div>';
 return '<div class="sequence"><img class="single-pose" loading="lazy" alt="" src="'+imgURL(start||peak)+'"></div>';
}
function sessionCount(s){return s.exercises.reduce((n,e)=>n+e.sets,0)}
function renderTabs(){
 document.getElementById("dayTabs").innerHTML=sessions.map((s,i)=>'<button class="day-tab '+(i===active?'active ':'')+(isDone(s.id)?'done':'')+'" data-day="'+i+'">'+s.tab+'<small>'+s.day+'</small></button>').join("");
 document.querySelectorAll(".day-tab").forEach(b=>b.addEventListener("click",()=>{active=Number(b.dataset.day);render()}));
}
function renderSession(){
 const s=sessions[active],done=isDone(s.id);
 document.getElementById("sessionTitle").textContent=s.title;
 document.getElementById("sessionFocus").textContent=s.focus;
 document.getElementById("exerciseList").innerHTML=s.exercises.map((e,i)=>
  '<article class="exercise"><div><div class="ex-head"><span class="num">'+String(i+1).padStart(2,"0")+'</span><div class="ex-title">'+e.name+'</div></div><div class="ex-volume">'+e.sets+' × '+e.reps+'</div><div class="ex-rest">Descanso: '+e.rest+'</div>'+(e.superset?'<div class="superset">SUPERSERIE '+e.superset+'</div>':'')+'</div>'+imageHTML(e)+'</article>'
 ).join("");
 const btn=document.getElementById("completeBtn");
 btn.textContent=done?"Día completado ✓":"Marcar día como hecho";
 btn.classList.toggle("completed",done);
 document.getElementById("notice").textContent=libraryState==="loading"?"Cargando ilustraciones de ejercicios…":libraryState==="error"?"No se han podido cargar algunas ilustraciones. Comprueba la conexión.":"";
}
function renderWeek(){
 const monday=mondayOfWeek(),today=localDate();
 const n=sessions.filter(s=>isDone(s.id)&&completions[monday+"|"+s.id]).length;
 const count=history.filter(h=>h.date>=monday&&h.date<=today).length;
 // Prefer the unique completed sessions recorded in the current Monday-Sunday window.
 document.getElementById("weekCount").textContent=Math.min(count,4)+" / 4";
 document.getElementById("weekBar").style.width=Math.min(count,4)/4*100+"%";
 document.getElementById("historyList").innerHTML=history.slice().sort((a,b)=>(b.date+b.session).localeCompare(a.date+a.session)).slice(0,8).map(h=>{
  const s=sessions.find(x=>x.id===h.session);
  return '<div class="history-item"><span><b>'+(s?s.title:h.session)+'</b></span><span>'+h.date+'</span></div>';
 }).join("")||'<div class="history-item"><span>Todavía no hay entrenamientos registrados.</span></div>';
}
function render(){renderTabs();renderSession();renderWeek()}
document.getElementById("completeBtn").addEventListener("click",()=>{
 const s=sessions[active],today=localDate(),k=today+"|"+s.id;
 if(completions[k]){
  delete completions[k];
  history=history.filter(h=>!(h.date===today&&h.session===s.id));
  document.getElementById("notice").textContent="Entrenamiento desmarcado.";
 }else{
  completions[k]=true;
  history=history.filter(h=>!(h.date===today&&h.session===s.id));
  history.push({date:today,session:s.id});
  document.getElementById("notice").textContent="Entrenamiento registrado.";
 }
 save();render();
});
async function loadExerciseArt(){
 try{
  const response=await fetch("https://exercise-dataset.com/exercises.json",{cache:"force-cache"});
  if(!response.ok)throw new Error("HTTP "+response.status);
  const data=await response.json();
  library=Array.isArray(data.exercises)?data.exercises:[];
  if(!library.length)throw new Error("Empty exercise library");
  libraryState="ready";
 }catch(e){libraryState="error"}
 renderSession();
}
render();
loadExerciseArt();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
